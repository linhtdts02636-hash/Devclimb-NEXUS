# Local development profile. Never use these credentials outside local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devclimb_nexus}
spring.datasource.username=${DB_USERNAME:devclimb}
spring.datasource.password=${DB_PASSWORD:devclimb_dev}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Validate the JPA mapping against NexusSchema.txt; never create or alter tables.
spring.jpa.hibernate.ddl-auto=validate

# Development-only authentication. Never enable this in production.
app.auth.dev-header.enabled=true
