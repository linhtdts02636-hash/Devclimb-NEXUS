spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/devclimb_nexus_test}
spring.datasource.username=${TEST_DB_USERNAME:devclimb}
spring.datasource.password=${TEST_DB_PASSWORD:devclimb_dev}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate

# Tests use the same dev-only header mechanism to authenticate requests.
app.auth.dev-header.enabled=true
